name: Deploy

on:
  push:
    branches: [main]
  # Run by hand to publish a scheduled post or refresh the GitHub card
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Reads my contribution calendar for the home page's GitHub card
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Tells Bing, Yandex and the other IndexNow engines that every page in the sitemap may have
      # changed, so they recrawl now instead of on their own schedule. The key is public: the file
      # of the same name in public/ proves the request comes from the site. A failed ping never
      # fails the deploy.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 07f43ca41b5ee5119506e6983bd3526b
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -s .)
          jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "elghareeb.space", key: $key, keyLocation: "https://elghareeb.space/\($key).txt", urlList: $urls}' \
            | curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- -w 'IndexNow: HTTP %{http_code}\n'
